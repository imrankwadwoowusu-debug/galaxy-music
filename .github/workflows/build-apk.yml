name: Build SARANGIFY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build SARANGIFY APK
        run: ./gradlew :app:assembleProdDebug --stacktrace

      - name: Upload SARANGIFY APK
        uses: actions/upload-artifact@v4
        with:
          name: SARANGIFY-APK
          path: app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
          retention-days: 7
